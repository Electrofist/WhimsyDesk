name: Bug
description: Something is broken in an object
labels: ["bug"]
body:
  - type: dropdown
    id: object
    attributes:
      label: Object
      options:
        - Desktop Fridge
        - Desktop Drawer
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 15.1, MacBook Air M2
    validations:
      required: true
  - type: markdown
    attributes:
      value: If a file was lost or ended up somewhere unexpected, please report it privately instead. See SECURITY.md.
