name: Release

# Push a tag named <object id>-v<version>, for example fridge-v1.0.
# The version must match the object's object.json.
#
# Each run:
#   1. publishes a versioned release for that object (history, checksums, zip for developers)
#   2. updates the "downloads" release: one friendly page with a permanent link per object
#      (.../releases/download/downloads/Desktop-Fridge.dmg always gives the newest version)
#
# Signing and notarization switch on by themselves when these repository secrets exist:
#   MACOS_CERTIFICATE           Developer ID Application certificate (.p12), base64 encoded
#   MACOS_CERTIFICATE_PASSWORD  password of that .p12
#   APPLE_ID                    Apple ID email
#   APPLE_APP_PASSWORD          app-specific password for that Apple ID
#   APPLE_TEAM_ID               10-character Team ID
# Without them the release is ad-hoc signed and the notes explain how to open it.

on:
  push:
    tags: ["*-v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the tag
        id: tag
        run: |
          TAG="$GITHUB_REF_NAME"
          ID="${TAG%-v*}"
          VERSION="${TAG##*-v}"
          if [ ! -f "objects/$ID/object.json" ]; then
            echo "::error::There is no object called '$ID' (tag $TAG)."
            exit 1
          fi
          CARD="$(jq -r .version "objects/$ID/object.json")"
          if [ "$CARD" != "$VERSION" ]; then
            echo "::error::The tag says version $VERSION but objects/$ID/object.json says $CARD. Make them match."
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Import the signing certificate (if set up)
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "No certificate secret: this release will be ad-hoc signed."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::The certificate has no Developer ID Application identity."
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build and package
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/release.sh "${{ steps.tag.outputs.id }}"

      - name: Publish the versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source dist-meta.env
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$NAME $VERSION" \
            --notes-file dist-notes.md \
            --latest=false

      - name: Update the Downloads page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source dist-meta.env
          STABLE="$RUNNER_TEMP/$(echo "$NAME" | tr ' ' '-').dmg"
          cp "dist/$BASE.dmg" "$STABLE"
          if ! gh release view downloads > /dev/null 2>&1; then
            gh release create downloads --target "$GITHUB_SHA" \
              --title "Download Desktop Objects" --notes "Getting the downloads ready." --latest
          fi
          gh release upload downloads "$STABLE#version $VERSION, for $RUNS_ON" --clobber
          NOTARIZED="$NOTARIZED" scripts/release/downloads-page.sh > "$RUNNER_TEMP/downloads.md"
          gh release edit downloads --title "Download Desktop Objects" --notes-file "$RUNNER_TEMP/downloads.md" --latest
