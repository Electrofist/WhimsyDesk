name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check object.json cards
    runs-on: macos-latest
    outputs:
      objects: ${{ steps.list.outputs.objects }}
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-objects.sh
      - id: list
        name: List objects
        run: echo "objects=$(ls -d objects/*/ | xargs -n1 basename | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.object }}
    needs: check
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        object: ${{ fromJson(needs.check.outputs.objects) }}
    defaults:
      run:
        working-directory: objects/${{ matrix.object }}
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: bash -c "$(jq -r .build.command object.json)"
      - name: Check the app was produced
        run: test -d "$(jq -r .build.app object.json)"
      - name: Test
        if: hashFiles(format('objects/{0}/Tests/**', matrix.object)) != ''
        # Not blocking yet: two fridge physics tests predate the current door tuning.
        # Make this blocking again once they are updated.
        continue-on-error: true
        run: swift test

  template:
    name: Template builds
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create an object from the template
        run: scripts/new-object.sh "Test Crate" ci-bot
      - name: Build it
        working-directory: objects/test-crate
        run: ./build.sh
      - name: Check the app was produced
        run: test -d "objects/test-crate/build/Desktop Test Crate.app"
