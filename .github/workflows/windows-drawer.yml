name: Windows drawer

on:
  push:
    paths:
      - "windows/drawer/**"
      - ".github/workflows/windows-drawer.yml"
  pull_request:
    paths:
      - "windows/drawer/**"
      - ".github/workflows/windows-drawer.yml"

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows/drawer
    steps:
      - uses: actions/checkout@v7

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/drawer/target
          key: windows-drawer-${{ hashFiles('windows/drawer/Cargo.lock') }}

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --release -p desktop-drawer

      - name: Package
        shell: pwsh
        run: |
          $out = "dist/Desktop Drawer"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item target/release/DesktopDrawer.exe $out
          @"
          Desktop Drawer for Windows

          A drawer along the bottom of your screen that holds your files.

          To run it: double-click DesktopDrawer.exe. There is nothing to install and
          no other files are needed (all pictures and sounds are drawn in code).

          Windows may warn that the app is from an unknown publisher, because it is
          not signed. Click "More info", then "Run anyway".

          Files you put in the drawer are kept in the "Desktop Drawer" folder in your
          user folder (%USERPROFILE%\Desktop Drawer). Right-click for Put Back,
          Open Drawer Folder, Move Everything to Desktop and Quit.

          Open source, MIT License: https://whimsydesk.art
          "@ | Set-Content -Encoding utf8 "$out/README.txt"
          Compress-Archive -Path $out -DestinationPath Desktop-Drawer-Windows.zip -Force

      - uses: actions/upload-artifact@v7
        with:
          name: Desktop-Drawer-Windows
          path: windows/drawer/Desktop-Drawer-Windows.zip
